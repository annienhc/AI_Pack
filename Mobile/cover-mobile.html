<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GenAI for Language Learning – Cover</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#f8fbff,#eef4fc 40%,#dbeafe);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;perspective:1600px}
.page{width:100%;max-width:420px;min-height:82vh;background:linear-gradient(160deg,#fbfdff,#eef4fc 60%,#dbeafe);border-radius:18px;box-shadow:0 22px 55px rgba(15,23,42,.2);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;transform-origin:left center;transition:transform .85s cubic-bezier(.645,.045,.355,1),opacity .85s}
.page.flip{transform:rotateY(-165deg);opacity:0}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.06) 1px,transparent 1px);background-size:34px 34px}
.orb{position:absolute;border-radius:50%;filter:blur(30px);pointer-events:none}
.orb1{width:220px;height:220px;background:radial-gradient(circle,rgba(59,130,246,.18),transparent 70%);top:-6%;right:-14%}
.orb2{width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,.14),transparent 70%);bottom:-4%;left:-10%}
.inner{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.card{width:100%;padding:22px 18px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 34px rgba(15,23,42,.08)}
.doc{background:rgba(255,255,255,.92);border:1px solid rgba(203,213,225,.8);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(59,130,246,.12);margin-bottom:20px}
.doc-h{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid rgba(203,213,225,.5)}
.hdot{width:9px;height:9px;border-radius:50%}
.typing{font-size:10px;font-weight:600;color:rgba(71,85,105,.9);font-family:'Courier New',monospace;margin-left:6px;overflow:hidden;white-space:nowrap;width:0;border-right:2px solid transparent;animation:typing 8s steps(22) infinite,caret .5s step-end infinite}
.doc-b{padding:14px;position:relative}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.line{height:8px;border-radius:5px;background:rgba(226,232,240,.8);flex:1}
.tag{font-size:9px;font-family:'Courier New',monospace;font-weight:700;white-space:nowrap;letter-spacing:.5px;opacity:0}
.good{color:#059669}.warn{color:#d97706}.bad{color:#dc2626}
.lg{animation:eg 8s ease-in-out infinite}.lw{animation:ew 8s ease-in-out infinite}.lb{animation:eb 8s ease-in-out infinite}
.tg{animation:tag 8s ease-in-out infinite}
.d1{animation-delay:.4s}.d2{animation-delay:1.1s}.d3{animation-delay:1.8s}.d4{animation-delay:2.5s}.d5{animation-delay:3.2s}
.scan{position:absolute;left:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.8),transparent);box-shadow:0 0 15px rgba(59,130,246,.6);animation:scan 8s ease-in-out infinite}
.title{font-size:32px;font-weight:900;line-height:1.1;color:#0f172a;text-align:center;letter-spacing:-.5px}
.title span{background:linear-gradient(135deg,#1e40af,#3b82f6,#6366f1);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:grad 6s ease infinite}
.subt{font-size:16px;color:#475569;font-weight:500;text-align:center;margin-top:8px}
.divv{width:60px;height:4px;margin:16px auto;border-radius:99px;background:linear-gradient(to right,transparent,rgba(59,130,246,.5),transparent)}
.ver{font-size:10px;color:#64748b;letter-spacing:4px;text-transform:uppercase;font-weight:700;text-align:center}
.open{margin-top:26px;display:inline-flex;align-items:center;gap:10px;padding:15px 40px;border-radius:99px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;box-shadow:0 10px 26px rgba(37,99,235,.35)}
.open:active{transform:scale(.96)}
.arrow{display:inline-block;animation:bounce 1.2s ease-in-out infinite}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes bounce{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes typing{0%{width:0}15%,75%{width:22ch}88%,100%{width:0}}
@keyframes caret{0%,100%{border-right-color:rgba(59,130,246,.6)}50%{border-right-color:transparent}}
@keyframes eg{0%,5%{background:rgba(226,232,240,.8)}14%,72%{background:rgba(16,185,129,.2)}84%,100%{background:rgba(226,232,240,.8)}}
@keyframes ew{0%,5%{background:rgba(226,232,240,.8)}14%,72%{background:rgba(245,158,11,.2)}84%,100%{background:rgba(226,232,240,.8)}}
@keyframes eb{0%,5%{background:rgba(226,232,240,.8)}14%,72%{background:rgba(239,68,68,.15)}84%,100%{background:rgba(226,232,240,.8)}}
@keyframes tag{0%,10%{opacity:0;transform:translateX(-5px)}18%,70%{opacity:1;transform:translateX(0)}82%,100%{opacity:0;transform:translateX(5px)}}
@keyframes scan{0%,3%{top:12px;opacity:0}6%{opacity:1}50%{top:calc(100% - 16px);opacity:1}56%,100%{top:calc(100% - 16px);opacity:0}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="grid"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="inner">
    <div class="card">
      <div class="doc">
        <div class="doc-h">
          <span class="hdot" style="background:#ef4444"></span>
          <span class="hdot" style="background:#f59e0b"></span>
          <span class="hdot" style="background:#10b981"></span>
          <span class="typing">Evaluating AI output...</span>
        </div>
        <div class="doc-b">
          <div class="row"><div class="line lg d1" style="max-width:82%"></div><span class="tag good tg d1">✓ Fact</span></div>
          <div class="row"><div class="line lw d2" style="max-width:65%"></div><span class="tag warn tg d2">⚠ Logic</span></div>
          <div class="row"><div class="line lg d3" style="max-width:76%"></div><span class="tag good tg d3">✓ OK</span></div>
          <div class="row"><div class="line lb d4" style="max-width:54%"></div><span class="tag bad tg d4">✗ Bias</span></div>
          <div class="row"><div class="line lg d5" style="max-width:70%"></div><span class="tag good tg d5">✓ Tone</span></div>
          <div class="scan"></div>
        </div>
      </div>
      <h1 class="title">GenAI for<br><span>Language Learning</span></h1>
      <p class="subt">Evaluating AI-generated Content</p>
      <div class="divv"></div>
      <p class="ver">Student Edition • 2026</p>
    </div>
    <button class="open" id="openBtn">Open <span class="arrow">→</span></button>
  </div>
</div>
<script>
(function(){
  var TARGET = 'notes-mobile.html';
  var page = document.getElementById('page');
  var btn = document.getElementById('openBtn');
  var going = false;
  function open(){ if(going) return; going = true; page.classList.add('flip'); setTimeout(function(){ window.location.href = TARGET; }, 820); }
  btn.addEventListener('click', open);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GenAI for Language Learning – Choose Version</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#e8f0fe,#f0f4fa 50%,#e4ecf7);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:34px 24px;box-shadow:0 20px 50px rgba(15,23,42,.12);text-align:center}
h1{font-size:26px;font-weight:800;color:#0f172a;line-height:1.2}
h1 span{background:linear-gradient(135deg,#1e40af,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:15px;color:#475569;margin-top:8px}
.divider{width:60px;height:4px;border-radius:99px;margin:20px auto;background:linear-gradient(to right,transparent,#3b82f6,transparent)}
.q{font-size:14px;color:#64748b;margin-bottom:16px;font-weight:600}
.opt{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:2px solid #e2e8f0;background:#fff;text-decoration:none;text-align:left;transition:all .2s;position:relative}
.btn:hover{border-color:#93c5fd;transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.15)}
.btn:active{transform:scale(.98)}
.btn .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.btn .t{font-size:16px;font-weight:700;color:#0f172a}
.btn .d{font-size:13px;color:#64748b;margin-top:2px}
.badge{position:absolute;top:-9px;right:14px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 3px 8px rgba(34,197,94,.3);display:none}
.badge.show{display:block}
.foot{font-size:12px;color:#94a3b8;margin-top:22px;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <h1>GenAI for<br><span>Language Learning</span></h1>
  <p class="sub">Evaluating AI-generated Content</p>
  <div class="divider"></div>
  <p class="q">Choose the best version for your device</p>
  <div class="opt">
    <a class="btn" href="./Desktop/index.html">
      <div class="ic" style="background:#eff6ff">💻</div>
      <div><div class="t">Desktop Version</div><div class="d">Full two-page book with page-flip effect</div></div>
      <span class="badge" id="badgeDesktop">Recommended</span>
    </a>
    <a class="btn" href="./Mobile/cover-mobile.html">
      <div class="ic" style="background:#f0fdf4">📱</div>
      <div><div class="t">Mobile Version</div><div class="d">One page at a time · swipe to turn</div></div>
      <span class="badge" id="badgeMobile">Recommended</span>
    </a>
  </div>
  <p class="foot">STUDENT EDITION • 2026</p>
</div>
<script>
(function(){
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var small = Math.min(window.innerWidth, window.innerHeight) < 820;
  var isMobile = touch && small;
  document.getElementById(isMobile ? 'badgeMobile' : 'badgeDesktop').classList.add('show');
})();
</script>
</body>
</html>
